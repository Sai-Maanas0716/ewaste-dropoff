<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>E-Waste Drop-off</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px;
      background: #f5f5f5;
    }
    h2 { color: #2e7d32; text-align: center; }
    p  { color: #555; text-align: center; font-size: 14px; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #333;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      box-sizing: border-box;
    }
    .photo-btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      text-align: center;
      margin-bottom: 12px;
    }
    #preview {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
    }
    #submitBtn {
      display: none;
      width: 100%;
      padding: 14px;
      background: #1565c0;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    #status {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>♻️ E-Waste Drop-off</h2>
    <p>Place your item and take a clear photo of it.</p>

    <label>Your Name (optional)</label>
    <input type="text" id="personName" placeholder="e.g. Ravi Kumar" />

    <label>Department (optional)</label>
    <input type="text" id="department" placeholder="e.g. CSE, ECE, Admin" />

    <label>Photo of E-Waste Item</label>
    <input type="file" id="fileInput"
           accept="image/*" capture="environment"
           style="display:none"
           onchange="previewImage(this)" />

    <button class="photo-btn"
            onclick="document.getElementById('fileInput').click()">
      📷 Take Photo
    </button>

    <img id="preview" alt="Preview" />

    <button id="submitBtn" onclick="submitPhoto()">
      ✅ Submit Drop-off
    </button>

    <div id="status"></div>
  </div>

  <script src="config.js"></script>
  <script>
    const IMGBB_API_KEY = typeof CONFIG !== 'undefined' ? CONFIG.IMGBB_API_KEY : '';
    const N8N_WEBHOOK   = typeof CONFIG !== 'undefined' ? CONFIG.N8N_WEBHOOK : '';

    function previewImage(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const preview = document.getElementById("preview");
        preview.src = e.target.result;
        preview.style.display = "block";
        document.getElementById("submitBtn").style.display = "block";
      };
      reader.readAsDataURL(file);
    }

    async function submitPhoto() {
  const status = document.getElementById("status");
  const file   = document.getElementById("fileInput").files[0];
  const name   = document.getElementById("personName").value || "Anonymous";
  const dept   = document.getElementById("department").value || "Not specified";

  if (!file) {
    status.textContent = "Please take a photo first.";
    return;
  }

  status.textContent = "⏳ Uploading photo...";
  document.getElementById("submitBtn").disabled = true;

  try {
    // Step 1 — Compress image if too large
    const compressedFile = await compressImage(file);
    console.log("File size:", compressedFile.size, "bytes");

    // Step 2 — Upload to imgBB
    const formData = new FormData();
    formData.append("image", compressedFile);
    formData.append("key", IMGBB_API_KEY);
    
    const imgRes = await fetch("https://api.imgbb.com/1/upload", {
      method: "POST",
      body: formData
    });
    
    const imgData = await imgRes.json();
    
    if (!imgData.success) {
      throw new Error(`imgBB error: ${imgData.error?.message || 'Unknown error'}`);
    }
    
    const imageUrl = imgData.data.url;
    console.log("Image uploaded:", imageUrl);

    // Step 3 — Send to n8n
    const n8nRes = await fetch(N8N_WEBHOOK, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        image_url  : imageUrl,
        person_name: name,
        department : dept,
        timestamp  : new Date().toLocaleString("en-IN",
                       { timeZone: "Asia/Kolkata" }),
        location   : "Block A Drop-off Point"
      })
    });

    if (!n8nRes.ok) {
      throw new Error(`n8n webhook failed: ${n8nRes.status}`);
    }

    status.innerHTML =
      "✅ <strong>Submitted successfully!</strong><br>" +
      "Thank you. The item has been logged.";
    
    // Reset
    document.getElementById("fileInput").value = "";
    document.getElementById("preview").style.display = "none";
    document.getElementById("submitBtn").style.display = "none";

  } catch (err) {
    console.error("Full error:", err);
    status.innerHTML =
      "❌ Submission failed:<br>" + err.message;
    document.getElementById("submitBtn").disabled = false;
  }
}

// Compress image function
async function compressImage(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (e) => {
      const img = new Image();
      img.src = e.target.result;
      img.onload = () => {
        const canvas = document.createElement("canvas");
        let width = img.width;
        let height = img.height;

        // Reduce size if too large
        if (width > 1920) {
          height = (height * 1920) / width;
          width = 1920;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        canvas.toBlob((blob) => {
          resolve(new File([blob], file.name, { type: "image/jpeg" }));
        }, "image/jpeg", 0.7); // 70% quality
      };
    };
  });
}
  </script>
</body>
</html>
